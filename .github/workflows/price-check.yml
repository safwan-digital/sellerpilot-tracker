name: Scheduled competitor price checks

on:
  schedule:
    # UTC: 02:17, 08:17, 14:17, 20:17 = every 6 hours (not exact)
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sellerpilot-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test price parser
        run: python -m unittest discover -s tests -v
      - name: Check public product metadata
        run: python scripts/check_prices.py
      - name: Commit updated price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json docs/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update scheduled price checks"
            git push
          else
            echo "No new data"
          fi
